name: Deploy Supabase Functions

on:
  workflow_dispatch:
  push:
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-functions.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check deployment token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "Add SUPABASE_ACCESS_TOKEN in GitHub repository Actions secrets"; exit 1; fi
      - name: Deploy access checker
        run: supabase functions deploy smartlearn-access --project-ref ktdrtgndvftlyakbavna
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy checkout initializer
        run: supabase functions deploy paystack-initialize --project-ref ktdrtgndvftlyakbavna
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy Paystack webhook
        run: supabase functions deploy paystack-webhook --project-ref ktdrtgndvftlyakbavna --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
